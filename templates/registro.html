{% extends 'base.html' %}{% block c %}<div class="hero" style="max-width:460px;margin:30px auto"><h1>Crea tu cuenta ⚽</h1>
<p class="mut">Cada persona tiene su propio progreso y sus propios trofeos.</p>
{% if err %}<div class="msg bad">{{ err }}</div>{% endif %}
<form method="post"><label class="mut" for="u">Usuario (3 a 20: letras, números o _)</label><input id="u" name="u" type="text" autocomplete="username" maxlength="20" autofocus required>
<label class="mut sepl" for="p">Clave (mínimo 8 caracteres)</label><input id="p" name="p" type="password" autocomplete="new-password" required>
<label class="mut sepl" for="p2">Repite la clave</label><input id="p2" name="p2" type="password" autocomplete="new-password" required>
{% if invite %}<label class="mut sepl" for="inv">Código de invitación</label><input id="inv" name="inv" type="password" required>{% endif %}
<div class="row"><button>Crear cuenta</button><a class="btn alt" href="{{ url_for('login') }}">Ya tengo cuenta</a></div></form></div>{% endblock %}
